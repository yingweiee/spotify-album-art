<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Album Art Details — Concepts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="switcher" aria-label="Concept">
    <p class="switcher-title">Art details concept</p>
    <div class="pills" role="tablist">
      <button role="tab" data-concept="flip">1 · Flip</button>
      <button role="tab" data-concept="explore">2 · Explore</button>
      <button role="tab" data-concept="sheet">3 · Sheet</button>
    </div>
    <p class="switcher-desc" id="conceptDesc"></p>
  </aside>

  <main class="phone" id="phone">
    <!-- ============ NOW PLAYING ============ -->
    <section class="player" id="player">
      <header class="bar">
        <button class="icon-btn" aria-label="Minimize">
          <svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" /></svg>
        </button>
        <span class="bar-title">Liked Songs</span>
        <button class="icon-btn" aria-label="More">
          <svg viewBox="0 0 24 24" class="fill"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </header>

      <button class="player-art" id="playerArt" aria-label="Open artwork">
        <img src="art.svg" alt="Low Tide Radio album artwork" draggable="false" />
      </button>

      <div class="track">
        <div>
          <h1>Avril Evenings</h1>
          <p>Oda Lumen</p>
        </div>
        <span class="liked" aria-label="Liked">
          <svg viewBox="0 0 24 24"><path d="M7 12.5l3.2 3.2L17 9" /></svg>
        </span>
      </div>

      <div class="progress">
        <div class="track-line"><div class="fill-line" id="fill"></div><div class="knob" id="knob"></div></div>
        <div class="times"><span id="elapsed">0:19</span><span id="remaining">-1:46</span></div>
      </div>

      <div class="controls">
        <button class="icon-btn" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3 1 4.5 3.5l2 3c1.5 2.5 2.5 3.5 4.5 3.5H21M18 14l3 3-3 3M3 17h3.5c1.3 0 2.2-.4 3-1.3M13.5 8.3c.8-.9 1.7-1.3 3-1.3H21M18 4l3 3-3 3"/></svg></button>
        <button class="icon-btn lg" aria-label="Previous"><svg viewBox="0 0 24 24" class="fill"><path d="M6 5h2.4v14H6zM19 5v14L9.5 12z"/></svg></button>
        <button class="play" id="play" aria-label="Pause"><svg viewBox="0 0 24 24" class="fill" id="playIcon"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg></button>
        <button class="icon-btn lg" aria-label="Next"><svg viewBox="0 0 24 24" class="fill"><path d="M15.6 5H18v14h-2.4zM5 5v14l9.5-7z"/></svg></button>
        <button class="icon-btn" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M20 6H8a4 4 0 0 0-4 4v1M7 21l-3-3 3-3M4 18h12a4 4 0 0 0 4-4v-1"/></svg></button>
      </div>

      <div class="subcontrols">
        <button class="icon-btn sm" aria-label="Devices"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="9" height="12" rx="1.5"/><rect x="13" y="8" width="8" height="12" rx="1.5"/><circle cx="17" cy="15" r="1.8"/></svg></button>
        <span></span>
        <button class="icon-btn sm" aria-label="Share"><svg viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 11v9h14v-9"/></svg></button>
        <button class="icon-btn sm" aria-label="Queue"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      </div>

      <div class="about">
        <div class="about-img"></div>
        <span>About the artist</span>
      </div>
    </section>

    <!-- ============ ARTWORK VIEWER ============ -->
    <section class="viewer" id="viewer" aria-hidden="true" data-concept="flip">
      <button class="icon-btn close" id="close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>

      <div class="stage" id="stage">
        <div class="mover" id="mover">
          <div class="card" id="card">
            <div class="face front">
              <img src="art.svg" alt="" draggable="false" />
              <div class="glare" id="glare"></div>
              <div class="hotspots" id="hotspots"></div>
            </div>
            <div class="face back" id="back"></div>
          </div>
        </div>
      </div>

      <p class="hint" id="hint">Drag to tilt · Tap for art details</p>

      <!-- Concept 2: annotation card -->
      <div class="annot" id="annot" aria-live="polite"></div>

      <!-- Concept 3: sheet -->
      <div class="sheet" id="sheet">
        <div class="grab" id="grab"><span></span></div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
